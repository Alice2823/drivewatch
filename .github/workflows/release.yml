name: macOS Release Automation

on:
  release:
    types: [published]

jobs:
  build-mac:
    name: Build & Upload macOS Artifacts (Universal)
    # ── RUNNER HISTORY & RATIONALE ────────────────────────────────────────────
    #
    # v1 — macos-latest (arm64, broken)
    #   GitHub migrated macos-latest to Apple Silicon (macos-14/15) in late 2024.
    #   arch: [x64, arm64] produced two separate DMGs; CI upload glob matched
    #   neither. Intel Mac users got the arm64 DMG → "not supported on this Mac".
    #
    # v2 — macos-13 (Intel x64, RETIRED → infinite queue)
    #   macos-13 was deprecated Sep 2025 and fully retired Dec 2025.
    #   Jobs queue forever: "Waiting for a runner to pick up this job..."
    #   No runner will ever be assigned. DO NOT USE.
    #
    # v3 — macos-latest (arm64, CORRECT — current)
    #   Safe because DriveWatch has ZERO native Node modules (no binding.gyp
    #   files exist anywhere in node_modules). All dependencies — systeminformation,
    #   electron-log, pdfkit, recharts — are pure JavaScript/TypeScript.
    #   electron-builder's universal build downloads pre-built Electron x64 and
    #   arm64 binaries from GitHub, then merges them with `lipo`. Since there is
    #   nothing to cross-compile, the runner architecture is irrelevant.
    #   The resulting DriveWatch.app runs natively on Intel Core i5 AND Apple M.
    #
    # ALTERNATIVE: macos-15-intel (Intel x64, available until Aug 2027)
    #   Use this only if native Node modules are ever added to the project.
    #   For the current pure-JS stack, macos-latest is simpler and always
    #   immediately available (no queue delays).
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build macOS Universal DMG
        # Produces a single dist/DriveWatch.dmg (universal fat binary).
        # electron-builder downloads pre-built Electron binaries for both x64
        # and arm64 from GitHub Releases, then merges them with lipo.
        # arch: universal in electron-builder.yml → single DriveWatch.dmg output.
        run: npm run build:mac-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/DriveWatch.dmg
            dist/latest-mac.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
