name: macOS Release Automation

on:
  release:
    types: [published]

jobs:
  build-mac:
    name: Build & Upload macOS Artifacts (Universal)
    # ── CRITICAL FIX ──────────────────────────────────────────────────────────
    # "macos-latest" was changed by GitHub in late 2024 to run on Apple Silicon
    # (arm64 / macos-14). Building a universal Electron app on an arm64 runner
    # causes native Node modules (e.g. systeminformation) to be compiled for
    # arm64 only. The x64 slice of the universal binary then contains arm64
    # .node files, and macOS refuses to launch it on Intel Macs with:
    #   "You can't open the application because it is not supported on this Mac"
    #
    # FIX: Use macos-13, which is the last Intel (x86_64) GitHub-hosted runner.
    # electron-builder can correctly cross-compile the arm64 slice from an Intel
    # host (via Rosetta + LLVM cross toolchain), producing a valid universal
    # binary that runs natively on BOTH Intel Core i5 and Apple Silicon Macs.
    runs-on: macos-13
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build macOS Universal DMG
        # Produces a single dist/DriveWatch.dmg (universal binary).
        # arch: universal in electron-builder.yml creates one fat .app containing
        # both x64 and arm64 slices — no separate per-arch DMGs are generated.
        run: npm run build:mac-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Increase heap for large universal binary linking step
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/DriveWatch.dmg
            dist/latest-mac.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

